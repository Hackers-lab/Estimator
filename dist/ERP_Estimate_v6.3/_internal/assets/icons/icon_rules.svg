<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20">
  <!-- Page background -->
  <rect x="2" y="1" width="16" height="18" rx="1.5" fill="#FFF2CC" stroke="#BF9000" stroke-width="0.8"/>
  <!-- Rule lines (tree-style nodes) -->
  <!-- Root node -->
  <circle cx="5" cy="5.5" r="1.5" fill="#BF9000" />
  <!-- Branch line -->
  <line x1="6.5" y1="5.5" x2="7.5" y2="5.5" stroke="#BF9000" stroke-width="1"/>
  <line x1="7.5" y1="5.5" x2="7.5" y2="10" stroke="#BF9000" stroke-width="1"/>
  <!-- Child 1 -->
  <line x1="7.5" y1="8" x2="9" y2="8" stroke="#BF9000" stroke-width="1"/>
  <circle cx="10.5" cy="8" r="1.5" fill="#4472C4" />
  <line x1="12" y1="8" x2="17" y2="8" stroke="#4472C4" stroke-width="1"/>
  <!-- Child 2 -->
  <line x1="7.5" y1="10" x2="9" y2="10" stroke="#BF9000" stroke-width="1"/>
  <circle cx="10.5" cy="10" r="1.5" fill="#4472C4" />
  <line x1="12" y1="10" x2="17" y2="10" stroke="#4472C4" stroke-width="1"/>
  <!-- Second rule block -->
  <circle cx="5" cy="14" r="1.5" fill="#BF9000" />
  <line x1="6.5" y1="14" x2="9" y2="14" stroke="#BF9000" stroke-width="1"/>
  <circle cx="10.5" cy="14" r="1.5" fill="#4472C4" />
  <line x1="12" y1="14" x2="17" y2="14" stroke="#4472C4" stroke-width="1"/>
</svg>
